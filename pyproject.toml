# Workspace-level tooling configuration. Each installable package lives in
# packages/<name>/ with its own pyproject.toml.

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# S105/S106: names of environment variables that hold secrets are not secrets.
ignore = ["S101", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]
"scripts/**" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["packages"]
pythonpath = [
    "packages/core/src",
    "packages/code-intel/src",
    "packages/planning/src",
    "packages/agents/src",
    "packages/ideation/src",
    "packages/security/src",
]
addopts = "-q --import-mode=importlib"
