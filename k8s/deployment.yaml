apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexcoder-app
  labels:
    app.kubernetes.io/name: nexcoder
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nexcoder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexcoder
    spec:
      containers:
        - name: app
          image: nexcoder:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: nexcoder-config
                  key: HOST
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: nexcoder-config
                  key: PORT
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: nexcoder-secrets
                  key: DB_URL
            - name: NEXCODER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexcoder-secrets
                  key: NEXCODER_API_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
