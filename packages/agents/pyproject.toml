[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faccoder-agents"
version = "0.1.0"
description = "Agent and skills catalog, personas, and LangGraph pipeline engine for faccoder."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "faccoder-core",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "langchain-core>=0.3",
  "langgraph>=0.2",
]

[project.scripts]
faccoder-agents = "faccoder_agents.cli:main"

[project.urls]
Homepage = "https://github.com/ThiagoVenturim/faccoder"
Repository = "https://github.com/ThiagoVenturim/faccoder"
Documentation = "https://github.com/ThiagoVenturim/faccoder/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/faccoder_agents"]
