[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexcoder-agents"
version = "0.1.0"
description = "Agent and skills catalog, personas, and LangGraph pipeline engine for nexcoder."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "nexcoder-core",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "langchain-core>=0.3",
  "langgraph>=0.2",
]

[project.scripts]
nexcoder-agents = "nexcoder_agents.cli:main"

[project.urls]
Homepage = "https://github.com/ThiagoVenturim/nexcoder"
Repository = "https://github.com/ThiagoVenturim/nexcoder"
Documentation = "https://github.com/ThiagoVenturim/nexcoder/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/nexcoder_agents"]
