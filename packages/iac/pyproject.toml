[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexcoder-iac"
version = "0.1.0"
description = "Infrastructure as Code engine: architecture catalog, multi-target generator (Terraform/OpenTofu, Ansible, Compose), user credential isolation, preview/plan gates, and control plane audit."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "nexcoder-core>=0.1.0",
    "nexcoder-control>=0.1.0",
    "nexcoder-agents>=0.1.0",
    "nexcoder-serving>=0.1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12",
]

[project.scripts]
nexcoder-iac = "nexcoder_iac.cli:main"

[project.urls]
Homepage = "https://github.com/ThiagoVenturim/nexcoder"
Repository = "https://github.com/ThiagoVenturim/nexcoder"
Documentation = "https://github.com/ThiagoVenturim/nexcoder/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/nexcoder_iac"]
