[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexcoder-control"
version = "0.1.0"
description = "Control plane for nexcoder: authentication, API keys, rate limits, metering, budgets, audit, approval tokens, and web panel."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "nexcoder-core>=0.1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "fastapi>=0.110",
]

[project.optional-dependencies]
web = [
    "uvicorn>=0.28",
]
cli = [
    "typer>=0.12",
]

[project.scripts]
nexcoder-control = "nexcoder_control.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexcoder_control"]
