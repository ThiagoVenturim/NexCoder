[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexcoder-mlops"
version = "0.1.0"
description = "MLOps lifecycle engine: dataset preparation, fine-tuning (LoRA/QLoRA/SFT), evaluation, experiment tracking with Langfuse, GPU cloud configs and cost estimation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "nexcoder-core>=0.1.0",
    "nexcoder-control>=0.1.0",
    "nexcoder-serving>=0.1.0",
    "nexcoder-agents>=0.1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12",
]

[project.scripts]
nexcoder-mlops = "nexcoder_mlops.cli:main"

[project.urls]
Homepage = "https://github.com/ThiagoVenturim/nexcoder"
Repository = "https://github.com/ThiagoVenturim/nexcoder"
Documentation = "https://github.com/ThiagoVenturim/nexcoder/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/nexcoder_mlops"]
