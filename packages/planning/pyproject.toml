[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexcoder-planning"
version = "0.1.0"
description = "Agentic planning for nexcoder: PRD conversion to epics/stories/tasks, sprint capacity modeling, and idempotent platform adapters."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "nexcoder-core>=0.1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/ThiagoVenturim/nexcoder"
Repository = "https://github.com/ThiagoVenturim/nexcoder"
Documentation = "https://github.com/ThiagoVenturim/nexcoder/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/nexcoder_planning"]
