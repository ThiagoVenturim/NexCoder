[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faccoder-planning"
version = "0.1.0"
description = "Agentic planning for faccoder: PRD conversion to epics/stories/tasks, sprint capacity modeling, and idempotent platform adapters."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "faccoder-core>=0.1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
cli = ["typer>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/faccoder_planning"]
