[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faccoder-security"
version = "0.1.0"
description = "Security scanners, specialist agents, and release gate for faccoder."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "faccoder-core>=0.1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
faccoder-security = "faccoder_security.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/faccoder_security"]
