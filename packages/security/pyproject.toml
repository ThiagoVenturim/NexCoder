[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexcoder-security"
version = "0.1.0"
description = "Security scanners, specialist agents, and release gate for nexcoder."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "nexcoder-core>=0.1.0",
    "nexcoder-control>=0.1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
nexcoder-security = "nexcoder_security.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexcoder_security"]
