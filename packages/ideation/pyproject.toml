[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexcoder-ideation"
version = "0.1.0"
description = "Ideation and research squad for nexcoder: free-text intake, multi-agent research with citations, b90 jury committee, and PRD generation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "nexcoder-core>=0.1.0",
    "nexcoder-agents>=0.1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexcoder_ideation"]
