[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faccoder-core"
version = "0.1.0"
description = "Foundation for faccoder: model registry (open source or paid), Langfuse tracing, structured LLM calls, hybrid retrieval and local vector store."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "langchain-core>=0.3",
  "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2"]
anthropic = ["langchain-anthropic>=0.2"]
google = ["langchain-google-genai>=2.0"]
ollama = ["langchain-ollama>=0.2"]
bedrock = ["langchain-aws>=0.2"]
langfuse = ["langfuse>=2.50"]
local-embeddings = ["sentence-transformers>=3.0"]
vector = ["sqlite-vec>=0.1.6"]
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
all = [
  "faccoder-core[openai,anthropic,google,ollama,langfuse,vector]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/faccoder_core"]
