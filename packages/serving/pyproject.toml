[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexcoder-serving"
version = "0.1.0"
description = "Serving profiles (vLLM, Ollama), RAG evaluation, LLM judge, and RAFT dataset builder."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "nexcoder-core>=0.1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12",
]

[project.scripts]
nexcoder-serving = "nexcoder_serving.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexcoder_serving"]
